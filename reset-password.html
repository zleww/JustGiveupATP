<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password · JurisCards Arena</title>
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#060d14">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/arena.css">
  <style>
    .auth-one { max-width: 460px; margin: 28px auto 60px; }
    .auth-one h1 { font-family: var(--font-display); font-size: clamp(1.6rem, 3vw, 2.2rem); margin-bottom: 10px; }
    .auth-one > p { color: var(--text-muted); margin-bottom: 18px; }
    .guest-link { display: block; text-align: center; margin-top: 16px; color: var(--text-muted); font-size: 0.88rem; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="JurisCards Arena home">
      <img class="brand-icon" src="icons/icon.svg" alt="" width="34" height="34">
      <span class="brand-name">JurisCards <span>Arena</span></span>
    </a>
    <div class="topbar-meta">
      <nav class="topnav" aria-label="Site">
        <a href="arena.html">Play</a>
        <a href="leaderboard.html">Leaderboard</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <div class="auth-one">
      <p class="eyebrow">Account</p>
      <h1>Choose a new password</h1>
      <p>This signs you out on every other device. The same account works on L-Lawliet and JurisCards.</p>
      <section class="panel">
        <form id="resetForm" novalidate>
          <input type="text" autocomplete="username" hidden>
          <div class="field">
            <label for="newPassword">New password</label>
            <input id="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
            <p class="hint">At least 8 characters, with a letter and a number.</p>
          </div>
          <div class="field">
            <label for="newPassword2">Confirm new password</label>
            <input id="newPassword2" type="password" autocomplete="new-password" required>
          </div>
          <button class="btn btn-gold btn-wide" id="resetBtn" type="submit">Save new password</button>
        </form>
        <p class="msg" id="resetMsg" role="status"></p>
      </section>
    </div>
  </main>

  <footer class="footer">JurisCards Arena · Laws from the L-Lawliet database</footer>

  <script src="js/session.js"></script>
  <script>
  (function () {
    const { API, saveSession, errorMessage } = ArenaSession;
    const $ = (id) => document.getElementById(id);
    const msg = $("resetMsg");
    function say(text, ok, link) {
      msg.className = "msg " + (ok ? "ok" : "err");
      msg.textContent = text;
      if (link) { msg.append(" "); const a = document.createElement("a"); a.href = link[0]; a.textContent = link[1]; msg.append(a); a.focus(); }
    }

    // The token arrives in the fragment (#token=...), which is never sent to a server.
    const token = new URLSearchParams(location.hash.slice(1)).get("token");
    if (location.hash) history.replaceState(null, "", location.pathname);
    if (!token) {
      $("resetForm").hidden = true;
      say("This page needs the link from your reset email.", false, ["login.html#forgot", "Ask for a new link"]);
      return;
    }

    $("resetForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const password = $("newPassword").value;
      if (password !== $("newPassword2").value) { say("The passwords do not match.", false); return; }
      $("resetBtn").disabled = true;
      msg.textContent = "";
      try {
        const res = await fetch(API + "/auth/reset-password", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, new_password: password }),
        });
        if (!res.ok) {
          say(await errorMessage(res), false, res.status === 400 ? ["login.html#forgot", "Send a new link"] : null);
          return;
        }
        saveSession(await res.json());
        $("resetForm").hidden = true;
        say("Password changed. You are signed in on this device.", true, ["index.html", "Go to the Arena"]);
      } catch (err) {
        say("Could not reach the server. Please try again.", false);
      } finally {
        $("resetBtn").disabled = false;
      }
    });
  })();
  </script>
</body>
</html>
