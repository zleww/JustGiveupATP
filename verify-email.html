<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm email · JurisCards Arena</title>
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#060d14">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/arena.css">
  <style>
    .auth-one { max-width: 460px; margin: 28px auto 60px; }
    .auth-one h1 { font-family: var(--font-display); font-size: clamp(1.6rem, 3vw, 2.2rem); margin-bottom: 10px; }
    .auth-one > p { color: var(--text-muted); margin-bottom: 18px; }
    .guest-link { display: block; text-align: center; margin-top: 16px; color: var(--text-muted); font-size: 0.88rem; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="JurisCards Arena home">
      <img class="brand-icon" src="icons/icon.svg" alt="" width="34" height="34">
      <span class="brand-name">JurisCards <span>Arena</span></span>
    </a>
    <div class="topbar-meta">
      <nav class="topnav" aria-label="Site">
        <a href="arena.html">Play</a>
        <a href="leaderboard.html">Leaderboard</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <div class="auth-one">
      <p class="eyebrow">Account</p>
      <h1>Confirm your email</h1>
      <section class="panel">
        <p class="msg" id="status" role="status" style="margin-top: 0;">Confirming…</p>
        <a class="guest-link" href="index.html">Go to the Arena</a>
      </section>
    </div>
  </main>

  <footer class="footer">JurisCards Arena · Laws from the L-Lawliet database</footer>

  <script src="js/session.js"></script>
  <script>
  (async function () {
    const { API, errorMessage } = ArenaSession;
    const status = document.getElementById("status");
    // Token from the fragment (never sent to a server), then cleared from the address bar.
    const token = new URLSearchParams(location.hash.slice(1)).get("token");
    if (location.hash) history.replaceState(null, "", location.pathname);
    if (!token) { status.className = "msg err"; status.textContent = "This page needs the link from your confirmation email."; return; }
    try {
      const res = await fetch(API + "/auth/verify-email", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token }),
      });
      if (!res.ok) {
        status.className = "msg err";
        status.textContent = (await errorMessage(res)) + " You can send a new link from Settings.";
        return;
      }
      const data = await res.json();
      status.className = "msg ok";
      status.textContent = `${data.email} is confirmed for @${data.username}. If you forget your password, use "Forgot password?" on the sign-in page.`;
    } catch (err) {
      status.className = "msg err";
      status.textContent = "Could not reach the server. Please reload the link.";
    }
  })();
  </script>
</body>
</html>
